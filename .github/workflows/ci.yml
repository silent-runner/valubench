name: build and check

# The correctness gate is the point of this workflow. valubench refuses to
# report a number it cannot verify, so a green run here means every registered
# kernel reproduced the scalar reference across message sizes, block boundaries,
# lane counts and iteration counts -- not merely that the code compiled.
on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
    name: ${{ matrix.cc }}
    steps:
      - uses: actions/checkout@v7

      # No dependencies beyond a C compiler and make. OpenCL is dlopen'd at run
      # time, so its absence on a runner is a normal no-device outcome rather
      # than a build failure -- which this job also proves.
      - name: show what this toolchain can build
        run: make CC=${{ matrix.cc }} config

      - name: build
        run: |
          make CC=${{ matrix.cc }} -j$(nproc)
          # A build step that builds nothing exits 0. One did: a rule added
          # above `all` became the default goal, so this passed in zero
          # seconds and the failure surfaced three jobs away as "No such file
          # or directory". Assert the artifact, not the exit status.
          test -x build/valubench || { echo "FAIL: make produced no binary"; exit 1; }

      - name: known-answer vectors and every kernel against its reference
        run: make CC=${{ matrix.cc }} check

      # A GitHub runner is a shared VM, so the throughput figure is worthless.
      # This runs the shortest possible measurement purely to prove the binary
      # executes end to end and verifies its own output.
      # The kernel checks prove the numbers are right. These prove the output
      # can be read at all: every JSON document parses, every documented exit
      # code is the one actually returned, bad arguments are rejected rather
      # than substituted, and sweep.py can still drive the binary. Two defects
      # found by review lived in exactly this gap.
      - name: output contract and argument validation
        run: make check-contract check-report

      - name: smoke run
        run: |
          ./build/valubench --samples 3 --time-ms 40 --warmup-ms 50 || \
            test $? -eq 3   # exit 3 is "too noisy to trust", expected on a runner
          ./build/valubench --list
          ./build/valubench --list --json | python3 -m json.tool > /dev/null

      # `make check` runs check-pinning too, but it skips itself on a
      # single-CPU machine -- correct for a developer's box and useless here.
      # Assert the runner can actually test it, so a change to the hosted
      # runner cannot turn this into a check that passes without checking.
      # That failure mode has already happened once in this project, when the
      # scalar-purity guard reported success while inspecting zero kernels.
      - name: the pinning check must not be vacuous here
        run: |
          n=$(nproc)
          echo "runner cpus: $n"
          test "$n" -ge 2 || { echo "FAIL: runner has $n cpu; check-pinning cannot run"; exit 1; }
          make check-pinning | tee /tmp/pin.log
          grep -q '^  ok    pinning' /tmp/pin.log || { echo "FAIL: check-pinning did not report ok"; exit 1; }

  # The ARM kernels are written and maintained on x86 machines, so without this
  # job they would only be exercised when someone remembered to. Throughput
  # under emulation is meaningless and nothing here records it -- but the
  # verification checksum is invariant across architectures, so `make check`
  # passing under qemu means NEON computes the same digests as x86.
  cross-aarch64:
    runs-on: ubuntu-latest
    name: aarch64 (cross, emulated)
    steps:
      - uses: actions/checkout@v7

      - name: install the cross toolchain and emulator
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-aarch64-linux-gnu qemu-user-static

      # HOSTCC stays native because embed_cl runs on the builder. BUILD keeps
      # the cross objects separate. The architecture comes from the compiler,
      # not from uname, so the build configures for aarch64.
      - name: configure for aarch64
        run: make CC=aarch64-linux-gnu-gcc HOSTCC=cc BUILD=build-arm64 config

      - name: build
        run: |
          make CC=aarch64-linux-gnu-gcc HOSTCC=cc BUILD=build-arm64 -j$(nproc)
          test -x build-arm64/valubench || { echo "FAIL: make produced no binary"; exit 1; }

      # This is the step that matters most: test_kernels sweeps message sizes,
      # block counts and iteration counts across every registered kernel, so it
      # reaches the multi-block paths a fixed-size smoke run never does.
      - name: known-answer vectors and every kernel, under emulation
        env:
          QEMU_LD_PREFIX: /usr/aarch64-linux-gnu
        run: make CC=aarch64-linux-gnu-gcc HOSTCC=cc BUILD=build-arm64 check

      - name: the checksum must match the x86 value
        env:
          QEMU_LD_PREFIX: /usr/aarch64-linux-gnu
        run: |
          # Run and parse separately, so the binary's exit status is visible
          # rather than masked by the pipeline. A crash then reports as a
          # crash instead of as an empty checksum that failed to match.
          #
          # 0 or 3, not 0. Exit 3 is "too noisy to trust", which under
          # emulation on a shared runner is ordinary and says nothing about
          # correctness -- the run still computed a checksum, which is the
          # only thing this step examines. An earlier version used pipefail
          # and rejected exit 3, which is the flakiness the sanitizer job
          # below documents and I reproduced under CPU contention.
          out=$(./build-arm64/valubench --kernel md5/neon-s4 --threads 1 \
                  --samples 2 --time-ms 20 --warmup-ms 20) && rc=0 || rc=$?
          case "$rc" in
            0|3) ;;
            *) echo "FAIL: the run exited $rc"; exit 1 ;;
          esac
          got=$(printf '%s' "$out" | grep -o 'checksum [0-9a-f]*' | cut -d' ' -f2)
          echo "neon: $got  (run exited $rc)"
          test "$got" = "955e84cbbc05470019604a2bd9ff2821"

      # The binary must start on an AArch64 CPU *without* SVE.
      #
      # It is built with SVE support on any toolchain that can emit it -- the
      # Makefile probes the compiler, not the host -- so every SVE row is
      # registered and gated at run time by HWCAP. Anything that reaches an SVE
      # instruction before that gate is a SIGILL on Graviton2, Ampere Altra, a
      # Raspberry Pi, or any Cortex-A5x/A7x.
      #
      # Not hypothetical: resolve_lanes() called svcntw() with no available()
      # check and every one of those machines died at startup, on a build whose
      # whole test suite passed. Nothing else here could see it, because qemu's
      # default linux-user CPU has SVE -- the `check` step above runs on a
      # 512-bit SVE machine without saying so.
      - name: the binary must start on AArch64 without SVE
        env:
          QEMU_LD_PREFIX: /usr/aarch64-linux-gnu
        run: |
          fail=0
          for cpu in neoverse-n1 cortex-a72 cortex-a53 max,sve=off; do
            qemu-aarch64-static -cpu $cpu ./build-arm64/valubench --list \
              >/dev/null 2>&1 && rc=0 || rc=$?
            if [ "$rc" = 0 ]; then echo "  ok   $cpu --list"
            else echo "  FAIL $cpu --list exit $rc"; fail=1; fi
          done
          # It must compute, not merely enumerate.
          want=955e84cbbc05470019604a2bd9ff2821
          got=$(qemu-aarch64-static -cpu neoverse-n1 ./build-arm64/valubench \
                  --kernel md5/neon-s4 --threads 1 --samples 2 --time-ms 20 \
                  --warmup-ms 20 | grep -o 'checksum [0-9a-f]*' | cut -d' ' -f2)
          if [ "$got" = "$want" ]; then echo "  ok   neoverse-n1 md5/neon-s4"
          else echo "  FAIL neoverse-n1 md5/neon-s4: $got"; fail=1; fi
          # And the full suite must pass there, which is what catches a guard
          # that stops the crash by quietly breaking something else.
          qemu-aarch64-static -cpu neoverse-n1 ./build-arm64/test_kernels \
            | tail -1 | sed 's/^/  /'
          qemu-aarch64-static -cpu neoverse-n1 ./build-arm64/test_kernels \
            >/dev/null 2>&1 || fail=1
          # The SVE rows must be present-but-unavailable, not absent: a build
          # that dropped them would pass everything above while testing nothing.
          n=$(qemu-aarch64-static -cpu neoverse-n1 ./build-arm64/valubench \
                --list | grep -c 'sve' || true)
          echo "  sve rows registered on a non-SVE cpu: $n"
          test "$n" -gt 0 || fail=1
          test "$fail" = 0

      # One binary, four vector lengths, one answer.
      #
      # SVE picks its width from the hardware, so the lane count -- and every
      # corpus offset derived from it -- is a run-time value. Nothing about
      # that is exercised by building, and no CI machine has SVE, but qemu
      # will pretend to any width.
      #
      # 384 bits earns its place precisely because no hardware has it: 12
      # lanes is the case that catches an accidental power-of-two assumption,
      # and 12 x 3 streams is the case that must decline to run at all,
      # because 36 does not divide the 768-message batch.
      - name: SVE and SVE2 at four vector lengths
        env:
          QEMU_LD_PREFIX: /usr/aarch64-linux-gnu
        run: |
          want=955e84cbbc05470019604a2bd9ff2821
          fail=0
          for vq in 1 2 3 4; do
            bits=$((vq * 128))
            for k in md5/sve-s2 md5/sve2-s2 md5/sve-s4 md5/sve2-s1; do
              got=$(qemu-aarch64-static -cpu max,sve-max-vq=$vq \
                      ./build-arm64/valubench --kernel $k --threads 1 \
                      --samples 2 --time-ms 20 --warmup-ms 20 \
                    | grep -o 'checksum [0-9a-f]*' | cut -d' ' -f2)
              if [ "$got" = "$want" ]; then
                echo "  ok   VL=$bits $k"
              else
                echo "  FAIL VL=$bits $k: $got"; fail=1
              fi
            done
          done
          # Multi-block messages, which the default 55-byte size never reaches.
          # A brace bug in the SVE hooks corrupted every block after the first
          # and was invisible at 55 bytes: the loop the hooks expand is one
          # statement by default and several when expanded, so an unbraced
          # `if (b == 0)` guarded only the first of them. Real hardware found
          # it; this would have found it first, and cheaper.
          for mb in 56 119 120 200; do
            for k in sha1/sve-s1 sha1/sve2-s2 sha512/sve-s1 md5/sve-s4; do
              got=$(qemu-aarch64-static -cpu max,sve-max-vq=2 \
                      ./build-arm64/valubench --kernel $k --message-bytes $mb \
                      --threads 1 --samples 2 --time-ms 20 --warmup-ms 20 \
                    | grep -o 'checksum [0-9a-f]*' | cut -d' ' -f2)
              ref=$(qemu-aarch64-static -cpu max,sve-max-vq=2 \
                      ./build-arm64/valubench --kernel ${k%%/*}/scalar-s1 \
                      --message-bytes $mb --threads 1 --samples 2 \
                      --time-ms 20 --warmup-ms 20 \
                    | grep -o 'checksum [0-9a-f]*' | cut -d' ' -f2)
              if [ "$got" = "$ref" ]; then echo "  ok   $mb B $k"
              else echo "  FAIL $mb B $k: $got vs $ref"; fail=1; fi
            done
          done
          # 36 lanes-times-streams does not tile the batch: the tool must say
          # so and exit 2, not report a verification failure against silicon
          # that is behaving perfectly.
          qemu-aarch64-static -cpu max,sve-max-vq=3 ./build-arm64/valubench \
            --kernel md5/sve-s3 --samples 1 --time-ms 20 --warmup-ms 20 \
            >/dev/null 2>&1 && rc=0 || rc=$?
          echo "  VL=384 md5/sve-s3 exit $rc (want 2)"
          test "$rc" = 2 || fail=1
          test "$fail" = 0

      # The SVE kernels must actually contain SVE instructions. The compiler
      # has surprised this project before by vectorising the scalar kernel;
      # the reverse mistake -- an SVE translation unit quietly falling back to
      # Advanced SIMD -- would be just as invisible in the output.
      - name: the SVE kernels must be SVE
        run: |
          for isa in sve sve2; do
            n=$(aarch64-linux-gnu-objdump -d build-arm64/kernel_$isa.o \
                | grep -cE '\b(ld1w|st1w|ld1d|st1d|eor3|bsl|xar|sri)\b|\bz[0-9]+\b')
            echo "  kernel_$isa.o: $n SVE-register instructions"
            test "$n" -gt 1000
          done

  # Address and UB sanitizers. This is the job that would have caught the
  # 32-entry device-array overrun on its own, without anyone thinking to try
  # 33 duplicate indices -- which is the argument for having it.
  #
  # Not the whole gate: scalar-purity disassembles the scalar kernel and counts
  # vector instructions, and sanitizer instrumentation changes that count. The
  # correctness suites are what matter here.
  sanitizers:
    runs-on: ubuntu-latest
    name: asan + ubsan
    steps:
      - uses: actions/checkout@v7

      # -O1 rather than the default -O2: sanitizer builds do not need it, and a
      # single cc1 on the instrumented s8 kernels peaked at 2.3 GB, which OOM'd
      # a 3.8 GB machine at -j2. GitHub's runner survives -O2 today; this is
      # insurance against a smaller one, and it builds faster.
      #
      # The test binaries are named explicitly. `all` builds valubench,
      # test_hashes and test_kernels but not test_checkpoints -- which is a
      # dependency of check-checkpoints -- so running it here exited 127.
      - name: build instrumented
        env:
          SAN: -O1 -fsanitize=address,undefined -fno-omit-frame-pointer -g
        run: |
          make CC=gcc CFLAGS_EXTRA="$SAN" BUILD=build-san config
          make CC=gcc CFLAGS_EXTRA="$SAN" BUILD=build-san -j$(nproc) \
               build-san/valubench build-san/test_hashes \
               build-san/test_kernels build-san/test_checkpoints

      - name: known-answer vectors and every kernel
        env:
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=0
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: |
          ./build-san/test_hashes
          ./build-san/test_kernels
          ./build-san/test_checkpoints

      # The CLI is the reachable attack surface: everything here is a local
      # input that once crashed or truncated.
      - name: argument handling under sanitizers
        env:
          ASAN_OPTIONS: abort_on_error=0
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: |
          set -e
          long=$(python3 -c 'print(",".join(["0"]*64))')
          for a in "--device $long" "--device 0,0" "--device 99" "--device -1" \
                   "--device 99999999999999999999" "--threads abc" \
                   "--message-bytes 12x" "--samples 0" "--reference-ladder 8,4,1"; do
            ./build-san/valubench $a >/dev/null 2>&1 && rc=0 || rc=$?
            echo "  $a -> exit $rc"
            test "$rc" = 2 || { echo "expected a usage error"; exit 1; }
          done
          # --where cpu on purpose. Some GPU drivers dlopen their compiler with
          # RTLD_DEEPBIND, which sanitizer runtimes cannot coexist with; that is
          # a known sanitizer limitation rather than anything about this code,
          # and the device path is covered by the pocl job instead.
          #
          # 0 or 3, not 0. Exit 3 means the run was too noisy to trust, which is
          # a normal outcome on a shared runner and says nothing about whether
          # the sanitizers found anything. Demanding 0 here would make the job
          # flaky for a reason unrelated to what it tests -- the same trap
          # check_output_contract.sh already documents.
          ./build-san/valubench --json --where cpu --samples 2 --time-ms 30 \
            --warmup-ms 30 > /dev/null && rc=0 || rc=$?
          echo "  cpu run exited $rc"
          test "$rc" = 0 || test "$rc" = 3

  # OpenCL has never executed in CI: no runner has a GPU. POCL provides a CPU
  # device, which exercises the host side -- loader, enumeration, corpus
  # upload, program build, readback and the device verification path -- none of
  # which needs real silicon to be wrong.
  opencl-software:
    runs-on: ubuntu-latest
    name: opencl (pocl)
    steps:
      - uses: actions/checkout@v7

      - name: install a software OpenCL device
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq pocl-opencl-icd ocl-icd-libopencl1 opencl-headers

      - name: build
        run: |
          make config && make -j$(nproc)
          test -x build/valubench || { echo "FAIL: make produced no binary"; exit 1; }

      - name: a device must be visible
        run: |
          ./build/valubench --list-devices
          ./build/valubench --list-devices --json > devices.json
          python3 -c "import json; d = json.load(open('devices.json'))['opencl']; assert d.get('devices'), 'pocl is installed but no device was enumerated'; print('  enumerated %d device(s)' % len(d['devices']))"

      - name: the device path must agree with the scalar reference
        run: |
          set -e
          for k in md5/ocl-s1 sha1/ocl-s1 sha512/ocl-s1; do
            alg=${k%%/*}
            got=$(./build/valubench --algorithm $alg --kernel $k --samples 2 \
                    --time-ms 50 --warmup-ms 50 \
                  | grep -o 'checksum [0-9a-f]*' | cut -d' ' -f2)
            want=$(./build/valubench --algorithm $alg --kernel $alg/scalar-s1 \
                     --samples 2 --time-ms 50 --warmup-ms 50 \
                   | grep -o 'checksum [0-9a-f]*' | cut -d' ' -f2)
            echo "  $k $got"
            test "$got" = "$want"
          done

      - name: streaming transfer and multi-device slicing must also verify
        run: |
          ./build/valubench --kernel md5/ocl-s1 --transfer stream \
            --samples 2 --time-ms 50 --warmup-ms 50 | grep -q "verified    yes"
          ./build/valubench --kernel md5/ocl-s2 --device 0 \
            --samples 2 --time-ms 50 --warmup-ms 50 | grep -q "verified    yes"
